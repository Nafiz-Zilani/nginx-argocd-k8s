apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: api-app
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-app
      sectionName: https
  hostnames:
    - "api.ghostengineer.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-app-svc
          port: 80