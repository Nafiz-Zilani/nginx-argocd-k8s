# api-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: nginx-app
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-app
      sectionName: http              # HTTP listener only
  hostnames:
    - "*.ghostengineer.xyz"          # ALL subdomains
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301          # permanent redirect
---
# Route 2: HTTPS traffic for ghost.ghostengineer.xyz → nginx pods
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
  namespace: nginx-app
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-app
      sectionName: https             # HTTPS listener only
  hostnames:
    - "*.ghostengineer.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-app-svc
          port: 80

