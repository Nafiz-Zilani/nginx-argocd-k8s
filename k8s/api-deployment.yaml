apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  namespace: api-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: html
          configMap:
            name: api-html
---
apiVersion: v1
kind: Service
metadata:
  name: api-app-svc
  namespace: api-app
spec:
  selector:
    app: api-app
  ports:
    - port: 80
      targetPort: 80